<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SadHolly</title>

<!-- ====== FIREBASE SDK ====== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
  }

  :root {
    --accent: #00ff99;
    --accent-dark: #00c853;
    --bg-dark: #0b0b0f;
    --panel-bg: #0b0b0f;
    --surface: #14141b;
    --surface-border: #26262f;
    --danger: #ff4d67;
  }

  body {
    height: 100vh;
    background: url("1000065880.png") center/cover fixed;
    color: white;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, rgba(10,5,20,.8), rgba(0,0,0,.85));
    z-index: 0;
  }

  input, select {
    width: 100%;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 12px;
    color: white;
    outline: none;
    font-size: 14px;
  }

  input:focus { border-color: var(--accent); }

  button {
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border: 0;
    border-radius: 12px;
    color: #05130c;
    cursor: pointer;
    font-weight: bold;
    transition: filter .15s ease, transform .1s ease;
  }

  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.97); }

  /* ============ LOGIN ============ */
  .login {
    position: absolute;
    z-index: 10;
    width: 90%;
    max-width: 420px;
    padding: 35px;
    background: rgba(11, 11, 15, .92);
    border: 1px solid var(--accent);
    border-radius: 20px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    box-shadow: 0 0 60px rgba(0,255,153,.15);
  }

  .logo {
    font-size: 34px;
    background: linear-gradient(135deg, #00ff99, #00c8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: bold;
    margin-bottom: 22px;
  }

  .login input { margin-bottom: 10px; }
  .login-hint { font-size: 12px; color: #888; margin-bottom: 16px; }
  .login button { width: 100%; }

  #error {
    color: var(--danger);
    margin-top: 10px;
    min-height: 18px;
    font-size: 13px;
  }

  /* ============ PANEL LAYOUT ============ */
  .panel {
    display: none;
    height: 100vh;
    position: relative;
    z-index: 5;
  }

  header {
    height: 56px;
    background: linear-gradient(90deg, #0b0b0f, #14101c);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 21px;
    font-weight: bold;
    color: var(--accent);
    border-bottom: 1px solid #262233;
  }

  .sound-toggle {
    position: absolute;
    right: 15px;
    top: 12px;
    z-index: 999;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
  }

  /* ============ SIDE MENUS ============ */
  .menu {
    position: absolute;
    top: 12px;
    z-index: 998;
  }

  .menu.left { left: 15px; }

  details {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 15px;
    padding: 10px;
    width: 250px;
    max-height: 70vh;
    overflow-y: auto;
  }

  summary {
    cursor: pointer;
    color: var(--accent);
    font-weight: bold;
    list-style: none;
  }

  summary::-webkit-details-marker { display: none; }

  /* ============ PROFILE CARD ============ */
  .profile { text-align: center; padding: 14px 4px 6px; }

  .avatar-wrap { position: relative; width: 84px; margin: 0 auto; }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--accent);
    display: block;
  }

  .avatar-edit {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent-dark);
    border: 2px solid #0b0b0f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: pointer;
    color: #05130c;
  }

  #profileName { margin-top: 12px; font-size: 16px; }

  .rank {
    margin-top: 8px;
    display: inline-block;
    padding: 5px 16px;
    border-radius: 20px;
    background: linear-gradient(135deg, #ff4d67, #ff8a4d);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: .5px;
  }

  .profile-edit {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--surface-border);
    display: none;
    flex-direction: column;
    gap: 8px;
    text-align: left;
  }

  .profile-edit.open { display: flex; }
  .profile-edit label { font-size: 11px; color: #999; }

  .upload-btn {
    display: block;
    text-align: center;
    background: var(--surface);
    border: 1px dashed var(--surface-border);
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    color: var(--accent);
  }

  .theme-row { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }

  .theme-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
  }

  .theme-dot.active { border-color: white; }

  /* ============ MEMBER LIST ============ */
  .member-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 2px;
    font-size: 13px;
  }

  .member-row img {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    object-fit: cover;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
  }

  .dot.online { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .member-status { margin-left: auto; font-size: 10px; color: #777; }

  /* ============ CHAT WINDOW ============ */
  .chat-wrap {
    position: absolute;
    top: 56px;
    left: 0;
    width: 100%;
    max-width: none;
    height: calc(100% - 56px);
    display: flex;
    flex-direction: column;
    background: var(--panel-bg);
    border: none;
    border-radius: 0;
    overflow: hidden;
    z-index: 1;
    box-shadow: none;
  }

  .chat-title {
    padding: 10px 20px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--surface-border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .group-avatar-wrap { position: relative; width: 42px; flex-shrink: 0; }

  .group-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent);
    display: block;
  }

  .group-avatar-edit {
    position: absolute;
    bottom: -3px;
    right: -3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent-dark);
    border: 2px solid #0b0b0f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    cursor: pointer;
    color: #05130c;
  }

  .chat-title .name { color: var(--accent); font-size: 14px; font-weight: bold; }
  .chat-title .status { font-size: 11px; color: #777; margin-top: 2px; }

  .pinned {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--surface-border);
    font-size: 12px;
    color: #ddd;
  }

  .pinned.show { display: flex; }
  .pinned b { color: var(--accent); margin-right: 6px; }
  .pinned span.close { cursor: pointer; color: #888; padding: 0 6px; }

  .chat {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--panel-bg);
  }

  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 10px; }

  .date-sep, .system-msg {
    align-self: center;
    color: #999;
    font-size: 12px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    padding: 6px 14px;
    border-radius: 20px;
  }

  /* message bubble */
  .msg-row { display: flex; gap: 10px; max-width: 78%; position: relative; }
  .msg-row.own { align-self: flex-end; flex-direction: row-reverse; }

  .msg-row .avatar-sm {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent);
    flex-shrink: 0;
  }

  .msg-body { min-width: 0; }

  .reply-quote {
    font-size: 11px;
    color: #999;
    background: rgba(255,255,255,.04);
    border-left: 3px solid var(--accent);
    padding: 5px 10px;
    border-radius: 6px;
    margin-bottom: 4px;
    cursor: pointer;
  }

  .msg {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    padding: 10px 14px;
    border-radius: 4px 16px 16px 16px;
    line-height: 1.4;
    position: relative;
  }

  .msg-row.own .msg {
    background: linear-gradient(135deg, #0f3d2b, #0c2e42);
    border: 1px solid #1c5a3f;
    border-radius: 16px 4px 16px 16px;
  }

  .mention { color: #00c8ff; font-weight: bold; }

  .msg-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .msg-meta b { font-size: 13px; }
  .msg-meta .rank-tag { font-size: 10px; color: #aaa; }
  .msg-time { font-size: 10px; color: #777; margin-left: 8px; }
  .msg-text { font-size: 14px; word-wrap: break-word; white-space: pre-wrap; }

  .msg-media img, .msg-media video {
    max-width: 240px;
    max-height: 260px;
    border-radius: 12px;
    display: block;
    margin-top: 6px;
  }

  .msg-media audio { width: 220px; margin-top: 6px; }

  .msg-actions {
    position: absolute;
    top: -14px;
    right: 6px;
    display: none;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 20px;
    padding: 3px 6px;
  }

  .msg-row.own .msg-actions { right: auto; left: 6px; }
  .msg-row:hover .msg-actions { display: flex; }

  .msg-actions span { cursor: pointer; font-size: 12px; padding: 2px 4px; }

  .reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }

  .reaction-pill {
    font-size: 11px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    padding: 2px 8px;
    border-radius: 12px;
    cursor: pointer;
  }

  .reaction-pill.mine { border-color: var(--accent); color: var(--accent); }

  .msg-status { display: block; font-size: 11px; color: #777; margin-top: 3px; }
  .msg-row.own .msg-status { text-align: right; }

  /* typing indicator */
  .typing {
    display: none;
    align-self: flex-start;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 4px 16px 16px 16px;
  }

  .typing.show { display: flex; }

  .typing span:not(.typing-label) {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #888;
    animation: blink 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  .typing-label { font-size: 11px; color: #999; margin-right: 4px; }

  @keyframes blink {
    0%, 80%, 100% { opacity: .25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }

  /* ============ REPLY BAR ============ */
  .reply-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: var(--surface);
    border-top: 1px solid var(--surface-border);
    font-size: 12px;
  }

  .reply-bar.show { display: flex; }
  .reply-bar b { color: var(--accent); }
  .reply-bar .close { cursor: pointer; color: #888; padding: 0 8px; }

  /* ============ SEND BAR (Telegram style) ============ */
  .send {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 8px 10px;
    background: var(--panel-bg);
    border-top: 1px solid var(--surface-border);
    position: relative;
  }

  .icon-btn {
    width: 46px;
    height: 46px;
    padding: 0;
    background: transparent;
    border: none;
    color: #9aa0a6;
    font-size: 22px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s ease, color .15s ease;
  }

  .icon-btn:hover { background: var(--surface); filter: none; }

  .send-mic-btn {
    color: #05130c;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    font-size: 20px;
  }

  .send-mic-btn:hover { filter: brightness(1.08); background: linear-gradient(135deg, var(--accent), var(--accent-dark)); }

  .icon-btn.recording {
    background: var(--danger);
    color: white;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .5; }
  }

  .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 24px;
    padding: 2px 6px 2px 20px;
    min-height: 48px;
    position: relative;
  }

  .input-wrap:focus-within { border-color: var(--accent); }

  .input-wrap input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 12px 6px;
    font-size: 16px;
    min-height: unset;
  }

  .input-wrap input:focus { border-color: transparent; }

  .emoji-inline-btn {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    cursor: pointer;
    border-radius: 50%;
    color: #9aa0a6;
  }

  .emoji-inline-btn:hover { background: var(--surface-border); }

  .emoji-picker {
    display: none;
    position: absolute;
    bottom: 62px;
    left: 10px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 14px;
    padding: 8px;
    gap: 4px;
    flex-wrap: wrap;
    width: 240px;
    z-index: 50;
  }

  .emoji-picker.open { display: flex; }

  .emoji-picker span { cursor: pointer; font-size: 18px; padding: 5px; border-radius: 8px; }
  .emoji-picker span:hover { background: var(--surface-border); }

  .upload-progress {
    font-size: 11px;
    color: var(--accent);
    padding: 4px 20px;
    display: none;
  }
  .upload-progress.show { display: block; }
</style>
</head>

<body>

  <!-- ============ LOGIN SCREEN ============ -->
  <div class="login" id="login">
    <div class="logo">☘ SadHolly</div>
    <input id="username" placeholder="Enter Name" onkeydown="if(event.key==='Enter') enter()">
    <div class="login-hint">Only SadHolly members can enter</div>
    <button onclick="enter()">ENTER</button>
    <div id="error"></div>
  </div>

  <!-- ============ MAIN PANEL ============ -->
  <div class="panel" id="panel">

    <header>☘ SadHolly</header>
    <div class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔔</div>

    <!-- profile menu -->
    <div class="menu left">
      <details>
        <summary>⋮ Profile</summary>

        <div class="profile">
          <div class="avatar-wrap">
            <img class="avatar" id="avatar" src="">
            <div class="avatar-edit" onclick="toggleEdit()">✎</div>
          </div>

          <h3 id="profileName"></h3>
          <div class="rank" id="rank"></div>

          <div class="profile-edit" id="profileEdit">
            <label>Profile photo</label>
            <label class="upload-btn" for="photoFile">📷 Upload from device</label>
            <input type="file" id="photoFile" accept="image/*" style="display:none" onchange="changePhoto(event)">

            <label id="themeLabel" style="margin-top:6px">Theme color</label>
            <div class="theme-row" id="themeRow"></div>
          </div>
        </div>
      </details>
    </div>

    <!-- members menu -->
    <div class="menu" style="right:15px;left:auto">
      <details>
        <summary>⋮ Members</summary>
        <div id="members"></div>
      </details>
    </div>

    <!-- chat -->
    <div class="chat-wrap">
      <div class="chat-title">
        <div class="group-avatar-wrap">
          <img class="group-avatar" id="groupAvatar" src="">
          <label class="group-avatar-edit" for="groupPhotoFile">✎</label>
          <input type="file" id="groupPhotoFile" accept="image/*" style="display:none" onchange="changeGroupPhoto(event)">
        </div>
        <div>
          <div class="name">💬 ChatHolly</div>
          <div class="status" id="onlineCount"></div>
        </div>
      </div>

      <div class="pinned" id="pinned">
        <div><b>📌 Pinned</b><span id="pinnedText"></span></div>
        <span class="close" onclick="unpin()">✕</span>
      </div>

      <div class="chat" id="chat">
        <div class="date-sep" id="dateSep"></div>
        <div class="system-msg">Wilcom arbab 🔥</div>
        <div class="typing" id="typing"><span class="typing-label" id="typingLabel"></span><span></span><span></span><span></span></div>
      </div>

      <div class="upload-progress" id="uploadProgress"></div>

      <div class="reply-bar" id="replyBar">
        <div>Replying to <b id="replyName"></b>: <span id="replyText"></span></div>
        <span class="close" onclick="cancelReply()">✕</span>
      </div>

      <div class="send">
        <button class="icon-btn" onclick="document.getElementById('mediaFile').click()">📎</button>
        <input type="file" id="mediaFile" accept="image/*,video/*" style="display:none" onchange="onMediaChosen(event)">

        <div class="input-wrap">
          <input id="message" placeholder="Message" oninput="onTyping()" onkeydown="if(event.key==='Enter') send()">
          <span class="emoji-inline-btn" onclick="toggleEmoji()">😊</span>
        </div>
        <div class="emoji-picker" id="emojiPicker"></div>

        <button class="icon-btn send-mic-btn" id="sendMicBtn" onclick="handleSendMic()">🎤</button>
      </div>
    </div>

  </div>

<script>
  // ====================================================================
  // FIREBASE CONFIG — replace with YOUR OWN project config.
  // Get this from: Firebase Console → Project Settings → General → Your apps → SDK setup
  // ====================================================================
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();

  let user = "";
  let soundOn = true;
  let replyTo = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let typingTimeout = null;
  let profiles = {};      // { name: avatarUrl }
  let presenceMap = {};   // { name: lastSeenMillis }
  let lastMsgCount = 0;
  let unpinnedByUser = false;

  const ranks = {
    "HitLeR": "OWNER",
    "SadHolly": "ADMIN",
    "YadTola": "ADMIN",
    "Napoleon": "ADMIN",
    "LorX": "ADMIN",
    "Demon": "ADMIN",
    "Angelo": "ADMIN",
    "Mamawd": "MEMBER"
  };

  const emojis = ["😀","😂","😍","😎","🔥","👍","🙏","❤️","😢","😡","🎉","👑","☘️","💀","😴","🤔"];
  const quickReactions = ["❤️","😂","👍","🔥","😮","😢"];
  const themeColors = ["#00ff99","#00c8ff","#ff4d67","#ffb800","#b467ff","#ff70a6"];

  function esc(s) {
    const d = document.createElement("div");
    d.innerText = s == null ? "" : s;
    return d.innerHTML;
  }

  function formatText(t) {
    return esc(t).replace(/@(\w+)/g, '<span class="mention">@$1</span>');
  }

  function formatTime(ts) {
    if (!ts) return "";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function nameColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    const palette = ["#00ff99","#00c8ff","#ff8a4d","#b467ff","#ff70a6","#ffd166","#4dd0e1"];
    return palette[Math.abs(hash) % palette.length];
  }

  function defaultAvatar(name) {
    const color = nameColor(name);
    const letter = (name || "?").charAt(0).toUpperCase();
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='84' height='84'><rect width='100%' height='100%' fill='${color}'/><text x='50%' y='50%' font-size='36' fill='#05130c' font-family='Arial' text-anchor='middle' dominant-baseline='central'>${letter}</text></svg>`;
    return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
  }

  function getAvatar(name) {
    return profiles[name] || defaultAvatar(name);
  }

  // ---------- LOGIN ----------
  function enter() {
    const raw = document.getElementById("username").value.trim();
    const name = Object.keys(ranks).find(n => n.toLowerCase() === raw.toLowerCase());

    if (!name) {
      document.getElementById("error").innerHTML = "❌ Member not found";
      return;
    }

    user = name;

    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "block";

    document.getElementById("profileName").innerHTML = user;
    document.getElementById("profileName").style.color = nameColor(user);
    document.getElementById("rank").innerHTML = ranks[user];
    document.getElementById("avatar").src = getAvatar(user);

    renderThemeDots();
    renderEmojiPicker();
    renderMembers();

    const dateSep = document.getElementById("dateSep");
    dateSep.textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    startPresence();
    listenProfiles();
    listenMeta();
    listenMessages();
    listenTyping();
  }

  // ---------- PRESENCE (online status) ----------
  function startPresence() {
    const ping = () => db.collection("presence").doc(user).set({ ts: Date.now() }).catch(()=>{});
    ping();
    setInterval(ping, 15000);
    db.collection("presence").onSnapshot(snap => {
      presenceMap = {};
      snap.forEach(doc => presenceMap[doc.id] = doc.data().ts);
      renderMembers();
    });
  }

  function isOnline(name) {
    const ts = presenceMap[name];
    return ts && (Date.now() - ts < 30000);
  }

  function renderMembers() {
    const box = document.getElementById("members");
    let onlineCount = 0;
    box.innerHTML = Object.keys(ranks).map(name => {
      const online = isOnline(name);
      if (online) onlineCount++;
      return `<div class="member-row">
        <img src="${getAvatar(name)}">
        <span class="dot ${online ? "online" : ""}"></span>
        <span>${esc(name)}</span>
        <span class="member-status">${ranks[name]}</span>
      </div>`;
    }).join("");
    document.getElementById("onlineCount").textContent = onlineCount + " online";
  }

  // ---------- PROFILES (avatars synced across users) ----------
  function listenProfiles() {
    db.collection("profiles").onSnapshot(snap => {
      snap.forEach(doc => profiles[doc.id] = doc.data().avatarUrl);
      if (profiles[user]) document.getElementById("avatar").src = profiles[user];
      renderMembers();
      renderMessagesCache();
    });
  }

  async function changePhoto(event) {
    const file = event.target.files[0];
    if (!file) return;
    showProgress("در حال آپلود عکس پروفایل...");
    try {
      const ref = storage.ref("avatars/" + user + "_" + Date.now());
      await ref.put(file);
      const url = await ref.getDownloadURL();
      await db.collection("profiles").doc(user).set({ avatarUrl: url });
      document.getElementById("avatar").src = url;
    } catch (e) {
      alert("خطا در آپلود عکس: " + e.message);
    }
    hideProgress();
  }

  // ---------- META (group avatar + pinned message) ----------
  function listenMeta() {
    db.collection("meta").doc("group").onSnapshot(doc => {
      const data = doc.data() || {};
      document.getElementById("groupAvatar").src = data.groupAvatar ||
        defaultAvatar("SH");
      if (data.pinned) {
        document.getElementById("pinned").classList.add("show");
        document.getElementById("pinnedText").textContent =
          " " + data.pinned.user + ": " + (data.pinned.text || "[media]");
      } else {
        document.getElementById("pinned").classList.remove("show");
      }
    });
  }

  async function changeGroupPhoto(event) {
    const file = event.target.files[0];
    if (!file) return;
    showProgress("در حال آپلود عکس گروه...");
    try {
      const ref = storage.ref("group/avatar_" + Date.now());
      await ref.put(file);
      const url = await ref.getDownloadURL();
      await db.collection("meta").doc("group").set({ groupAvatar: url }, { merge: true });
    } catch (e) {
      alert("خطا در آپلود عکس گروه: " + e.message);
    }
    hideProgress();
  }

  function pinMessage(id) {
    const m = messageCache.find(x => x.id === id);
    if (!m) return;
    db.collection("meta").doc("group").set({
      pinned: { user: m.user, text: m.text || "" }
    }, { merge: true });
  }

  function unpin() {
    db.collection("meta").doc("group").set({ pinned: null }, { merge: true });
  }

  // ---------- TYPING INDICATOR ----------
  function onTyping() {
    db.collection("typing").doc(user).set({ ts: Date.now() }).catch(()=>{});
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      db.collection("typing").doc(user).delete().catch(()=>{});
    }, 2000);
  }

  function listenTyping() {
    db.collection("typing").onSnapshot(snap => {
      const now = Date.now();
      const others = [];
      snap.forEach(doc => {
        if (doc.id !== user && (now - doc.data().ts) < 2500) others.push(doc.id);
      });
      const typingEl = document.getElementById("typing");
      const label = document.getElementById("typingLabel");
      if (others.length) {
        label.textContent = others.join(", ") + " در حال تایپ";
        typingEl.classList.add("show");
      } else {
        typingEl.classList.remove("show");
      }
    });
  }

  // ---------- MESSAGES ----------
  let messageCache = [];

  function listenMessages() {
    db.collection("messages").orderBy("timestamp", "asc").limitToLast(200)
      .onSnapshot(snap => {
        messageCache = [];
        snap.forEach(doc => messageCache.push({ id: doc.id, ...doc.data() }));
        renderMessagesCache();

        if (messageCache.length > lastMsgCount && lastMsgCount !== 0) {
          const last = messageCache[messageCache.length - 1];
          if (last.user !== user && soundOn) beep();
        }
        lastMsgCount = messageCache.length;
      });
  }

  function renderMessagesCache() {
    const chat = document.getElementById("chat");
    chat.querySelectorAll(".msg-row").forEach(el => el.remove());
    const typingEl = document.getElementById("typing");

    messageCache.forEach(m => {
      const row = document.createElement("div");
      row.className = "msg-row" + (m.user === user ? " own" : "");
      row.dataset.id = m.id;

      const av = document.createElement("img");
      av.className = "avatar-sm";
      av.src = getAvatar(m.user);
      row.appendChild(av);

      const body = document.createElement("div");
      body.className = "msg-body";

      if (m.replyTo) {
        const rq = document.createElement("div");
        rq.className = "reply-quote";
        rq.innerHTML = "↩ <b>" + esc(m.replyTo.user) + "</b>: " + esc(m.replyTo.text || "[media]");
        body.appendChild(rq);
      }

      const bubble = document.createElement("div");
      bubble.className = "msg";

      const meta = document.createElement("div");
      meta.className = "msg-meta";
      meta.innerHTML = '<b style="color:' + nameColor(m.user) + '">' + esc(m.user) + "</b>" +
        '<span class="rank-tag">' + (ranks[m.user] || "") + "</span>" +
        '<span class="msg-time">' + formatTime(m.timestamp) + "</span>";
      bubble.appendChild(meta);

      if (m.text) {
        const txt = document.createElement("div");
        txt.className = "msg-text";
        txt.innerHTML = formatText(m.text);
        bubble.appendChild(txt);
      }

      if (m.media) {
        const md = document.createElement("div");
        md.className = "msg-media";
        if (m.media.type === "image") md.innerHTML = '<img src="' + m.media.url + '">';
        else if (m.media.type === "video") md.innerHTML = '<video src="' + m.media.url + '" controls></video>';
        else if (m.media.type === "audio") md.innerHTML = '<audio src="' + m.media.url + '" controls></audio>';
        bubble.appendChild(md);
      }

      const actions = document.createElement("div");
      actions.className = "msg-actions";
      let actionsHtml = '<span onclick="startReply(\'' + m.id + '\')" title="Reply">↩</span>' +
        '<span onclick="pinMessage(\'' + m.id + '\')" title="Pin">📌</span>';
      quickReactions.forEach(e => {
        actionsHtml += '<span onclick="toggleReaction(\'' + m.id + '\',\'' + e + '\')">' + e + "</span>";
      });
      actions.innerHTML = actionsHtml;
      bubble.appendChild(actions);

      if (m.reactions && Object.keys(m.reactions).length) {
        const rx = document.createElement("div");
        rx.className = "reactions";
        const counts = {};
        Object.values(m.reactions).forEach(e => counts[e] = (counts[e] || 0) + 1);
        let rxHtml = "";
        Object.entries(counts).forEach(([e, c]) => {
          const mine = m.reactions[user] === e;
          rxHtml += '<span class="reaction-pill' + (mine ? " mine" : "") + '" onclick="toggleReaction(\'' + m.id + "','" + e + '\')">' + e + " " + c + "</span>";
        });
        rx.innerHTML = rxHtml;
        bubble.appendChild(rx);
      }

      body.appendChild(bubble);
      row.appendChild(body);
      chat.insertBefore(row, typingEl);
    });

    chat.scrollTop = chat.scrollHeight;
  }

  function startReply(id) {
    const m = messageCache.find(x => x.id === id);
    if (!m) return;
    replyTo = { user: m.user, text: m.text || "" };
    document.getElementById("replyName").textContent = m.user;
    document.getElementById("replyText").textContent = m.text || "[media]";
    document.getElementById("replyBar").classList.add("show");
    document.getElementById("message").focus();
  }

  function cancelReply() {
    replyTo = null;
    document.getElementById("replyBar").classList.remove("show");
  }

  async function toggleReaction(id, emoji) {
    const ref = db.collection("messages").doc(id);
    const m = messageCache.find(x => x.id === id);
    const current = (m && m.reactions) || {};
    const field = "reactions." + user;
    if (current[user] === emoji) {
      await ref.update({ [field]: firebase.firestore.FieldValue.delete() });
    } else {
      await ref.update({ [field]: emoji });
    }
  }

  async function send() {
    const input = document.getElementById("message");
    const text = input.value.trim();
    if (!text) return;

    const msg = {
      user,
      text,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (replyTo) msg.replyTo = replyTo;

    input.value = "";
    cancelReply();
    db.collection("typing").doc(user).delete().catch(()=>{});

    try {
      await db.collection("messages").add(msg);
    } catch (e) {
      alert("پیام ارسال نشد: " + e.message);
    }
  }

  async function sendMedia(url, type) {
    const msg = {
      user,
      media: { url, type },
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (replyTo) msg.replyTo = replyTo;
    cancelReply();
    await db.collection("messages").add(msg);
  }

  async function onMediaChosen(event) {
    const file = event.target.files[0];
    if (!file) return;
    const isVideo = file.type.startsWith("video");
    showProgress("در حال آپلود " + (isVideo ? "ویدیو" : "عکس") + "...");
    try {
      const ref = storage.ref("media/" + user + "_" + Date.now() + "_" + file.name);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      await sendMedia(url, isVideo ? "video" : "image");
    } catch (e) {
      alert("خطا در آپلود فایل: " + e.message);
    }
    hideProgress();
    event.target.value = "";
  }

  // ---------- VOICE RECORDING ----------
  async function handleSendMic() {
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(recordedChunks, { type: "audio/webm" });
          showProgress("در حال آپلود ویس...");
          try {
            const ref = storage.ref("voice/" + user + "_" + Date.now() + ".webm");
            await ref.put(blob);
            const url = await ref.getDownloadURL();
            await sendMedia(url, "audio");
          } catch (e) {
            alert("خطا در آپلود ویس: " + e.message);
          }
          hideProgress();
        };
        mediaRecorder.start();
        isRecording = true;
        document.getElementById("sendMicBtn").classList.add("recording");
        document.getElementById("sendMicBtn").textContent = "⏹";
      } catch (e) {
        alert("دسترسی به میکروفون داده نشد.");
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      document.getElementById("sendMicBtn").classList.remove("recording");
      document.getElementById("sendMicBtn").textContent = "🎤";
    }
  }

  // ---------- EMOJI ----------
  function renderEmojiPicker() {
    const picker = document.getElementById("emojiPicker");
    picker.innerHTML = emojis.map(e => `<span onclick="insertEmoji('${e}')">${e}</span>`).join("");
  }

  function insertEmoji(e) {
    const input = document.getElementById("message");
    input.value += e;
    input.focus();
  }

  function toggleEmoji() {
    document.getElementById("emojiPicker").classList.toggle("open");
  }

  // ---------- PROFILE EDIT / THEME ----------
  function toggleEdit() {
    document.getElementById("profileEdit").classList.toggle("open");
  }

  function renderThemeDots() {
    const row = document.getElementById("themeRow");
    const current = localStorage.getItem("sadholly_theme_" + user) || themeColors[0];
    document.documentElement.style.setProperty("--accent", current);
    row.innerHTML = themeColors.map(c =>
      `<div class="theme-dot ${c === current ? "active" : ""}" style="background:${c}" onclick="setTheme('${c}')"></div>`
    ).join("");
  }

  function setTheme(c) {
    document.documentElement.style.setProperty("--accent", c);
    localStorage.setItem("sadholly_theme_" + user, c);
    renderThemeDots();
  }

  // ---------- SOUND ----------
  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById("soundToggle").textContent = soundOn ? "🔔" : "🔕";
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 700;
      g.gain.value = 0.05;
      o.start();
      setTimeout(() => { o.stop(); ctx.close(); }, 120);
    } catch (e) {}
  }

  // ---------- UPLOAD PROGRESS UI ----------
  function showProgress(text) {
    const el = document.getElementById("uploadProgress");
    el.textContent = text;
    el.classList.add("show");
  }
  function hideProgress() {
    document.getElementById("uploadProgress").classList.remove("show");
  }
</script>

</body>
</html>
